name: ghost-dl
on:
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev libncurses-dev
      - name: Test
        run: make test
      - name: Build
        run: make CFLAGS="-O2 -g -Werror"
      - name: Smoke test
        run: |
          ./ghost-dl --version
          ./ghost-dl --help >/dev/null

  packages:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libncurses-dev \
            rpm fakeroot zstd libarchive-tools
      - name: Build packages
        run: make dist
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-dl-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz

  macos:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: macos-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: brew install curl ncurses
      - name: Build
        run: make
      - name: Package tarball
        run: |
          VERSION="$(sed -n 's/^VERSION ?= //p' Makefile | head -1)"
          ARCH="$(uname -m)"
          NAME="ghost-dl-${VERSION}-macos-${ARCH}"
          mkdir -p "dist/${NAME}/man"
          cp ghost-dl LICENSE README.md "dist/${NAME}/"
          cp packaging/ghost-dl.1 "dist/${NAME}/man/"
          tar -czvf "dist/${NAME}.tar.gz" -C dist "${NAME}"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-dl-macos
          path: dist/ghost-dl-*-macos-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [packages, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: dist/*
          replacesArtifacts: true
          name: ${{ github.ref_name }} - ghost-dl
          bodyFile: "RELEASE_BODY.md"
          allowUpdates: true
